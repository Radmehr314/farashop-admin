name: Deploy admin

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-farashop-admin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ vars.API_URL }}
      VITE_STORE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check variables
        run: test -n "$VITE_API_URL" && test -n "$VITE_STORE_URL" || { echo "Set API_URL and SITE_URL repository variables" >&2; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, novintamas-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site

      - name: Deploy
        run: sudo /usr/local/bin/farashop-deploy admin "$RUNNER_TEMP/site"
